name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:installer
      - run: npx playwright install --with-deps chromium
      - name: Browser checks with isolated fixtures
        shell: bash
        run: |
          set -euo pipefail
          for spec in tests/browser/*.spec.ts; do
            npx playwright test "$spec" --output "test-results/$(basename "$spec" .spec.ts)"
          done
      - name: Retain failed browser diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failures
          path: |
            test-results/**/trace.zip
            test-results/**/error-context.md
            test-results/**/test-failed-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Scan repository history and built assets (redacted)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir dist --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir plugins --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir examples --redact=100 --no-banner
