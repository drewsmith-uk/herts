name: Quality
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check:release -- --phase=prepare
      - name: Package tested build
        run: |
          tar -cf release-build.tar .runtime/release-dist \
            plugins/{tasks,reading,bots}/{client.js,server.mjs,THIRD_PARTY_NOTICES.txt} \
            plugins/pinned/{client.js,THIRD_PARTY_NOTICES.txt} \
            examples/notes/{client.js,server.mjs,THIRD_PARTY_NOTICES.txt}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build
          path: release-build.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 1
      - name: Scan repository history and built assets (redacted)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir .runtime/release-dist --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir plugins --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir examples --redact=100 --no-banner
  browser:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-build
      - run: tar -xf release-build.tar
      - run: npx playwright install --with-deps chromium
      - run: npm run check:release -- --phase=browser --shard=${{ matrix.shard }}/2
        env:
          DEBUG: pw:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: browser-timings-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/release-timings-*
          retention-days: 7
  verify:
    needs: [prepare, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all release checks
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: test "$PREPARE_RESULT" = success && test "$BROWSER_RESULT" = success
  check:
    needs: verify
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve the required check status
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success
